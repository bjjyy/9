<body>
    <textarea id="betInput" rows="6" style="padding: 15px; margin: 15px; width: 99%; box-sizing: border-box; resize: vertical;" placeholder="输入格式: 01 02 03个号5 或 龙兔各号10 或 红蓝各号50，减 牛羊各号5"></textarea>

    <div id="topInfoRow">
        <div id="previewBox"><span class="addon-title">解析预览：</span><span id="previewText" class="addon-muted">输入内容后这里显示预计识别结果</span></div>
    </div>
    
    <div class="button-group">
        <button type="button" id="openPickerAssistant">挑码助手</button>
        <button onclick="if(confirm('确定全部归零吗？\n普通盘和香港盘统计、计入历史都会一起清空。')) resetBets()">归零</button>
        <button onclick="undoLastBet()">撤回</button>
        <button type="button" id="quickHongKongButton" class="quick-amount-btn" style="background:#fff;color:#111827;border:1px solid #111827" title="在输入框开头添加香港关键词">香港</button>
        <button id="mainPlaceBetButton" onclick="placeBet()" style="background:#dc2626;color:#fff;border:1px solid #b91c1c">计入</button>
        <span id="quickAmountButtons" aria-label="快捷金额" style="display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:4px;">
            <button type="button" class="quick-amount-btn" data-amount="5">5</button>
            <button type="button" class="quick-amount-btn" data-amount="10">10</button>
            <button type="button" class="quick-amount-btn" data-amount="15">15</button>
            <button type="button" class="quick-amount-btn" data-amount="20">20</button>
            <button type="button" class="quick-amount-btn" data-amount="50">50</button>
            <button type="button" class="quick-amount-btn" data-amount="100">100</button>
        </span>
    </div>
    
    <h3 id="totalBetDisplay" style="margin-top:15px;">下注总数: 0</h3>
    <div class="number-grid" id="numbers"></div>

    <h3 id="hkTotalBetDisplay" class="board-title">香港下注总数: 0</h3>
    <div class="number-grid" id="hkNumbers"></div>

    <script>
    const numbers = Array.from({ length: 49 }, (_, i) => (i + 1).toString().padStart(2, '0'));
    const zodiacNumbers = {
    "马": ["01", "13", "25", "37", "49"],
    "蛇": ["02", "14", "26", "38"],
    "龙": ["03", "15", "27", "39"],
    "兔": ["04", "16", "28", "40"],
    "虎": ["05", "17", "29", "41"],
    "牛": ["06", "18", "30", "42"],
    "鼠": ["07", "19", "31", "43"],
    "猪": ["08", "20", "32", "44"],
    "狗": ["09", "21", "33", "45"],
    "鸡": ["10", "22", "34", "46"],
    "猴": ["11", "23", "35", "47"],
    "羊": ["12", "24", "36", "48"]
};
    const colorMap = {
        "红": ["01", "02", "07", "08", "12", "13", "18", "19", "23", "24", "29", "30", "34", "35", "40", "45", "46"],
        "蓝": ["03", "04", "09", "10", "14", "15", "20", "25", "26", "31", "36", "37", "41", "42", "47", "48"],
        "绿": ["05", "06", "11", "16", "17", "21", "22", "27", "28", "32", "33", "38", "39", "43", "44", "49"]
    };

    let bets = Object.fromEntries(numbers.map(num => [num, 0]));
    let hkBets = Object.fromEntries(numbers.map(num => [num, 0]));
    const savedBets = localStorage.getItem('bets');
    if (savedBets) {
        try {
            const parsed = JSON.parse(savedBets);
            numbers.forEach(num => {
                if (parsed[num] !== undefined) bets[num] = parsed[num];
            });
        } catch(e){}
    }
    const savedHkBets = localStorage.getItem('hkBets');
    if (savedHkBets) {
        try {
            const parsed = JSON.parse(savedHkBets);
            numbers.forEach(num => {
                if (parsed[num] !== undefined) hkBets[num] = parsed[num];
            });
        } catch(e){}
    }
    let lastBet = { normal: {}, hk: {}, target: 'normal' };
    let currentBets = bets;
    let currentLastBet = lastBet.normal;
    function saveBets(){
        localStorage.setItem('bets', JSON.stringify(bets));
        localStorage.setItem('hkBets', JSON.stringify(hkBets));
    }

    function applyBetToNum(num, delta) {
        const prev = currentBets[num] || 0;
        const next = Math.max(0, prev + delta);
        const actualChange = next - prev;
        if (actualChange === 0) return;
        if (!currentLastBet[num]) currentLastBet[num] = 0;
        currentLastBet[num] += actualChange;
        currentBets[num] = next;
    }

function toHalfWidth(str) {
    return str
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[＋－／．，：；｜　]/g, ch => ({
            '＋': '+', '－': '-', '／': '/', '．': '.', '，': ',', '：': ':', '；': ';', '｜': '|', '　': ' '
        }[ch] || ch));
}

function formatBetAmount(value) {
    const num = Number(value);
    if (!Number.isFinite(num)) return '0';
    return parseFloat(num.toFixed(4)).toString();
}

function preprocessInput(input) {
    input = toHalfWidth(input).replace(/[\u200B-\u200D\u2060\uFEFF]/g, '').trim();

    // 输入文字别名：仅替换字形，后续解析与金额算法保持原样。
    input = input.replace(/免/g, '兔').replace(/名/g, '各');
    // “猴鸡狗各肖10”按每个生肖总额10处理，沿用原有“猴鸡狗各10”规则。
    input = input.replace(/([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)\s*各肖(?=\s*\d)/g, '$1各');

    // OCR/手写习惯纠错：数字上下文中的 o / O 视为数字 0。
    // 只在紧邻数字、数字分隔符或金额单位/“各”等明确数字环境时转换，
    // 避免把普通英文单词里的 o/O 改成 0。
    input = input.replace(/([0-9])\s*[oO](?=[0-9\s.,，。+\-、各个号数米元块]|$)/g, '$10');
    input = input.replace(/(^|[\s.,，。+\-、#])\s*[oO](?=[0-9])/g, '$10');

    // 多行安全隔离：默认每一行独立解析，防止上一行金额与下一行号码串在一起。
    // 但允许一种高确定性的“纯号码列表跨行续写”：
    // 上一行只有号码/分隔符、没有金额；下一行继续号码并明确出现“各/各号/各数/个 + 金额”。
    // 例：07.31.01.25.04.28.22.34.\n05.29.23.35.各五 应视为同一笔。
    if (/[\r\n]/.test(input)) {
        const rawLines = input.split(/\r?\n+/).map(s => s.trim()).filter(Boolean);
        const mergedLines = [];
        for (let i = 0; i < rawLines.length; i++) {
            let line = rawLines[i];
            while (i + 1 < rawLines.length) {
                const next = rawLines[i + 1];
                const currentNums = line.match(/\d{1,2}/g) || [];
                const currentIsPureNumList = currentNums.length >= 2 &&
                    /^[\s\d.,，。+\-、]+$/.test(line) &&
                    !/(?:各|个|号|数|头|尾|米|元|块|买|下|投|压)/.test(line);
                const nextCompletesBet = /^(?:\s*\d{1,2}\s*(?:[.,，。+\-、]\s*|\s+))+\d{1,2}\s*[.,，。+\-、]*\s*(?:各号各|各各|各个|各号|各数|个数|号各|数各|个号|号个|各|个)\s*[零一二三四五六七八九十百千0-9]+(?:\.\d+)?\s*(?:米|元|块钱|块)?[，。,.；;\s]*$/.test(next);
                if (!(currentIsPureNumList && nextCompletesBet)) break;
                line += ' ' + next;
                i++;
            }
            mergedLines.push(line);
        }
        return mergedLines.map(line => preprocessInput(line)).filter(Boolean).join('#');
    }

    // 多个“头”或“颜色波”共用一笔明确金额时，先复制金额到每一组。
    // 例：1头2头各号10、红波蓝波各号10；没有金额时不展开。
    input = input.replace(/((?:[0-4]\s*头\s*){2,})(各号|各数|个号|各|个)\s*(\d+(?:\.\d+)?)/g,
      (match, groups, word, amount) => (groups.match(/[0-4]\s*头/g) || []).map(g => g.replace(/\s+/g, '') + word + amount).join(' # '));
    input = input.replace(/((?:[红蓝绿]\s*波\s*){2,})(各号|各数|个号|各|个)\s*(\d+(?:\.\d+)?)/g,
      (match, groups, word, amount) => (groups.match(/[红蓝绿]\s*波/g) || []).map(g => g.replace(/\s+/g, '') + word + amount).join(' # '));

    // 金额前输入分隔符：各、各号、各数、个、每个号、每个号码、每个数、数各。
    // 只移除动作词与明确数字金额之间的空格或标点，不触碰号码列表。
    const amountWord = '(?:每个号码|每个号|每个数|各号|各数|数各|各|个)';
    input = input.replace(new RegExp('(' + amountWord + ')[ \\t]*[.。,:：，、][ \\t]*(?=\\d)', 'g'), '$1');
    input = input.replace(new RegExp('(' + amountWord + ')[ \\t]+(?=\\d)', 'g'), '$1');
    // “每个数”是“每个号码”的同义输入，仅在紧跟金额时标准化。
    input = input.replace(/每个数(?=\d)/g, '每个号码');
    input = input.replace(/数各(?=\d)/g, '各号');
    // 同一行连续下注，下一段也有明确动作词时隔开金额与新号码列表。
    input = input.replace(new RegExp('(' + amountWord + '\\d+)[ \\t]+(?=(?:\\d{1,2}[ \\t]+)+\\d{1,2}[ \\t]*' + amountWord + ')', 'g'), '$1 # ');

    // 新增兼容：只处理“号码/组 + 各各/各个 + 金额”这类明确重复写法
    // 01各各5 -> 01各5；11各个5 -> 11各5
    input = input.replace(/各{2,}(?=\s*\d)/g, '各');
    input = input.replace(/各个(?=\s*\d)/g, '各');
    input = input.replace(/两/g, '二');
    input = input.replace(/[（(【\[]/g, ' ').replace(/[）)】\]]/g, ' ');

    // ===== 新增识别率增强层：只处理语义明确的输入习惯，不改变后续原有算法 =====
    // 新增：买 + 数字头/尾 时，“买”只作为聊天动词忽略。
    // 例：今晚买1头各号10 -> 今晚 1头各号10；买3尾各号20 -> 3尾各号20
    input = input.replace(/买(?=\s*\d+\s*(?:头|尾))/g, ' ');

    // 1) “买”只是句首/连接动词时，不让它被后面的通用“买=>各号”规则误当成“每个号码”。
    //    例：买牛羊各50 -> 牛羊各50（仍按每个生肖总额计算）。
    input = input.replace(/买(?=\s*(?:[鼠牛虎兔龙蛇马羊猴鸡狗猪]|\d{1,2}(?:\s|[.，,、+\-\/]|$)|家肖|家禽|野兽|野肖|大单|小单|大双|小双|红|蓝|绿|大数|小数))/g, ' ');

    // 2) 支持“单个号码 + 金额单位”的省略写法。必须带“米/元/块”等金额单位才转换，避免把普通号码列表误判。
    //    例：44.十米 / 44十米 / 44=10元 -> 44各号十 / 44各号十 / 44各号10。

      (match, prefix, num, amount) => {

        for (let i = 0; i < match.length; i++) {
            const char = match[i];
            if (char in map) {
                temp = map[char];
            } else if (char in unit) {
                if (temp === 0 && char === '十') temp = 1;
                result += temp * unit[char];
                lastUnit = unit[char];
                temp = 0;
                hasUnit = true;
            }
        }
        if (temp > 0 && hasUnit) {
            if (lastUnit === 100) result += temp * 10;
            else if (lastUnit === 10) result += temp;

            result += temp;
        }
        return result;
    });

    const singleDigitMap = { '零': '0', '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };
    input = input.replace(/[零一二三四五六七八九]/g, ch => singleDigitMap[ch]);

    input = input.replace(/各号买/g, '各号');

    input = input.replace(/([^鼠牛虎兔龙蛇马羊猴鸡狗猪\s])([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)(?:肖)?\s*(?:各|个)\s*(\d+(?:\.\d+)?)(?=\s|$)/g,
    (match, prefixChar, zodiacText, amount) => {

    input = input.replace(/\b((?:\d{1,2}\s+)+\d{1,2})\s*各(?:号)?\s*(\d+(?:\.\d+)?)(?=\s|$)/g, (match, numText, amount) => {

    input = input.replace(/((?:家肖|家禽|野兽|野肖|大单|小单|大双|小双|红单|红双|蓝单|蓝双|绿单|红蓝绿|红蓝|红绿|蓝绿|大数|小数|[0-9]+头|[0-9]+尾|[鼠牛虎兔龙蛇马羊猴鸡狗猪]+|[红蓝绿]波))\s*(\d+)(?!\d|\s*头)/g, '$1各号$2');

    input = input.replace(/([0-9]+)尾各号(\d+)/g, (match, tails, number) => {

        for (let i = 1; i < 50; i++) {

    input = input.replace(/(?<!各号)(?<!\d)((?:\d{1,2}\s+)+\d{1,2})\s*各号(\d+(?:\.\d+)?)(?=\s|#|$)/g,

    return input;
}

    if(!parts.length) return '';
    let out=parts.join('、');
    if(out.length>40) out=out.slice(0,40)+'…';
    return out;
  }

  // 新增：仅整理输入排版，不参与下注计算。
  // 当“各/各号 + 金额”后出现空格并准备输入下一组时，把空格换成回车。
  function autoBreakAfterAmount(el){
    if(!el) return;
    const oldValue=el.value;
    const oldPos=typeof el.selectionStart==='number'?el.selectionStart:oldValue.length;
    let before=oldValue.slice(0,oldPos);
    let after=oldValue.slice(oldPos);

    // 输入到金额后按空格：立即换成回车。
    before=before.replace(/(各(?:号)?\s*\d+(?:\.\d+)?)[ \t]+$/g, '$1\n');
    // 一次性粘贴多组：只在上一组已经明确有“各/各号+金额”时分行。
    before=before.replace(/(各(?:号)?\s*\d+(?:\.\d+)?)[ \t]+(?=(?:减\s*)?(?:(?:香港|港|香)\s*)?(?:\d{1,2}(?=[.，,、+\-\/\s])|[鼠牛虎兔龙蛇马羊猴鸡狗猪红蓝绿]|家肖|家禽|野兽|野肖|大单|小单|大双|小双|大数|小数))/g, '$1\n');

    const newValue=before+after;
    if(newValue!==oldValue){
      el.value=newValue;
      const newPos=before.length;
      try{ el.setSelectionRange(newPos,newPos); }catch(e){}
    }
  }

  function refreshPreview(){
    const el=document.getElementById('betInput'), out=document.getElementById('previewText'), box=document.getElementById('topInfoRow'); if(!el||!out)return;
    if(!el.value.trim()){
      out.innerHTML='输入内容后这里显示预计识别结果';
      if(box) box.style.display='flex';
      return;
    }
    if(box) box.style.display='flex';
    try{
      const t=previewParse(el.value).text;
      const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      if(t.includes('⚠ 未识别：')){
        const idx=t.indexOf('⚠ 未识别：');
        out.innerHTML=esc(t.slice(0,idx))+'<span class="unrecognized-warning">'+esc(t.slice(idx))+'</span>';
      }else if(t.includes('全部识别')){
        out.innerHTML=esc(t.replace('全部识别',''))+'<span class="recognized-ok">全部识别</span>';
      }else{
        out.textContent=t;
      }
    }catch(e){ out.textContent='预览暂时无法识别，但不会影响原下注功能'; }
  }

  async function copyBoard(which){
    const board=which==='hk'?hkBets:bets; const name=which==='hk'?'香港盘':'普通盘';
    const active=numbers.filter(n=>Number(board[n]||0)>0);
    const total=Object.values(board).reduce((s,v)=>s+Number(v||0),0);
    let text=`${name}\n下注总额：${formatBetAmount(total)}\n有下注号码：${active.length}个\n`;
    text+=active.length?active.map(n=>`${n}=${formatBetAmount(board[n])}`).join('\n'):'暂无下注';
    try{ await navigator.clipboard.writeText(text); alert(name+'统计已复制'); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy'); alert(name+'统计已复制');}catch(_){alert(text);} ta.remove();
    }
  }

  function installEvents(){
    const input=document.getElementById('betInput');
    input.addEventListener('input',function(){ autoBreakAfterAmount(input); refreshPreview(); });

    const betBtn=document.querySelector('button[onclick="placeBet()"]');
    const undoBtn=document.querySelector('button[onclick="undoLastBet()"]');
    const resetBtn=document.querySelector('button[onclick="resetBets()"]');

    if(betBtn){
      betBtn.addEventListener('click',function(){
        const raw=input.value.trim(); const isHk=/香港|港|香/.test(raw);
        pendingSnapshot={raw,isHk,before:cloneState(isHk?hkBets:bets)};
        setTimeout(function(){
          if(!pendingSnapshot)return;
          const after=cloneState(pendingSnapshot.isHk?hkBets:bets);
          const changes=getChanged(pendingSnapshot.before,after);
          if(changes.length){
            const total=totalAbs(changes), action=changes.reduce((s,x)=>s+x.delta,0)<0?'减注':'下注';
            const summary=`${action}成功｜${changes.length}个号码｜本次金额 ${formatBetAmount(total)}`;
            if(pendingSnapshot.isHk) lastSuccessCountHk=changes.length; else lastSuccessCountNormal=changes.length;
            lastUndoSummary=targetName(pendingSnapshot.isHk)+'｜'+summary;
            addHistory({time:timeText(),target:targetName(pendingSnapshot.isHk),raw:pendingSnapshot.raw,summary});
          }else{
            if(pendingSnapshot && pendingSnapshot.isHk) lastSuccessCountHk=0; else lastSuccessCountNormal=0;
          }
          pendingSnapshot=null; updateCounts(); refreshPreview();
        },0);
      },true);
    }

    if(undoBtn){
      undoBtn.addEventListener('click',function(){
        const undoText=lastUndoSummary;
        setTimeout(function(){
          if(undoText!=='暂无可撤回记录') addHistory({time:timeText(),target:'撤回',raw:'撤回上一笔',summary:undoText});
          lastUndoSummary='暂无可撤回记录'; updateCounts();
        },0);
      },true);
    }

    if(resetBtn){ resetBtn.addEventListener('click',()=>setTimeout(()=>{ saveHistory([]); renderHistory(); updateCounts(); lastUndoSummary='暂无可撤回记录'; },0),true); }
    document.getElementById('copyNormalStats').addEventListener('click',()=>copyBoard('normal'));
    document.getElementById('copyHkStats').addEventListener('click',()=>copyBoard('hk'));
  }

  ensurePanel(); renderHistory(); updateCounts(); refreshPreview(); installEvents();
})();
</script>

<script id="pickerAssistantScript">
(function(){
  'use strict';
  const overlay=document.createElement('div');
  overlay.id='pickerAssistantOverlay';
  overlay.innerHTML=`
    <section id="pickerAssistantDialog" role="dialog" aria-modal="true" aria-labelledby="paTitle">
      <div class="pa-head"><h2 id="paTitle">挑码助手</h2><button type="button" class="pa-close" id="paClose" aria-label="关闭">×</button></div>

      <div id="paGroups"></div>
      <div class="pa-result">
        <div class="pa-result-title">挑码结果 <span id="paResultCount">(0个号码)</span></div>
        <div style="font-size:13px;line-height:1.7;color:#444">选号结果会自动放入左侧输入框并加上「各号」。左侧输入框填写的金额始终按每个号码金额处理；如需按总金额平均分摊，请在这里填写「各」总金额并点击「平摊计入」。</div>
      </div>
      <div class="pa-controls pa-amount-controls">
        <label for="paAmountEach">各号金额 <input id="paAmountEach" type="text" value="可在输入框内填写" readonly aria-readonly="true" /></label>
        <label for="paAmountTotal">各（总金额） <input id="paAmountTotal" type="number" min="0" step="any" value="0" /></label>
      </div>
      <div class="pa-controls pa-submit-controls">
        <button type="button" id="paCountTotal" class="pa-primary">平摊计入</button>
        <button type="button" id="paCopy">复制号码</button>
        <button type="button" id="paClear" class="pa-danger">清空选择</button>
      </div>
      <div id="paStatus" class="pa-status" aria-live="polite"></div>
    </section>`;
  // Append to <html>, not the scaled body, so the modal is a normal viewport overlay.
  document.documentElement.appendChild(overlay);

  const groups=[
    {title:'生肖',key:'zodiac',items:['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪']},
    {title:'单双、大小、合数',key:'shape',items:['单','双','大','小','合单','合双','合大','合小','尾大','尾小','大单','小单','大双','小双']},
    {title:'家禽野兽',key:'animal',items:['家禽(牛马羊鸡狗猪)','野兽(兔虎鼠猴蛇龙)']},
    {title:'五行',key:'element',items:['金','木','水','火','土']},
    {title:'波色',key:'color',items:['红波','蓝波','绿波']},
    {title:'波色单双',key:'colorOddEven',items:['红单','红双','蓝单','蓝双','绿单','绿双']},
    {title:'头数',key:'head',items:['0头','1头','2头','3头','4头']},
    {title:'尾数',key:'tail',items:['0尾','1尾','2尾','3尾','4尾','5尾','6尾','7尾','8尾','9尾']}
  ];
  const selected=new Map();
  let result=[];
  let resultReady=false;
  const nums=Array.from({length:49},(_,i)=>String(i+1).padStart(2,'0'));
  const zodiacNumbers = {
    '马':['01','13','25','37','49'],'蛇':['02','14','26','38'],'龙':['03','15','27','39'],
    '兔':['04','16','28','40'],'虎':['05','17','29','41'],'牛':['06','18','30','42'],
    '鼠':['07','19','31','43'],'猪':['08','20','32','44'],'狗':['09','21','33','45'],
    '鸡':['10','22','34','46'],'猴':['11','23','35','47'],'羊':['12','24','36','48']
  };
  const colorMap = {
    '红':['01','02','07','08','12','13','18','19','23','24','29','30','34','35','40','45','46'],
    '蓝':['03','04','09','10','14','15','20','25','26','31','36','37','41','42','47','48'],
    '绿':['05','06','11','16','17','21','22','27','28','32','33','38','39','43','44','49']
  };
  const poultry=['牛','马','羊','鸡','狗','猪'];
  const wild=['兔','虎','鼠','猴','蛇','龙'];
  // 2026年五行号码表（按号码直接映射，不能用生肖五行代替）
  const elements={
    '金':['04','05','12','13','26','27','34','35','42','43'],
    '木':['08','09','16','17','24','25','38','39','46','47'],
    '水':['01','14','15','22','23','30','31','44','45'],
    '火':['02','03','10','11','18','19','32','33','40','41','48','49'],
    '土':['06','07','20','21','28','29','36','37']
  };
  const $=id=>document.getElementById(id);
  function zodiacOf(n){return Object.keys(zodiacNumbers).find(z=>zodiacNumbers[z].includes(n));}
  function digitSum(n){return Number(n[0])+Number(n[1]);}
  function getAttrSet(group,item){
    let out=[];
    if(group==='zodiac') out=zodiacNumbers[item]||[];
    else if(group==='shape'){
      out=nums.filter(n=>{
        const v=Number(n), sum=digitSum(n), tail=v%10;
        switch(item){
          case '单':return v%2===1;
          case '双':return v%2===0;
          case '大':return v>=25;
          case '小':return v<=24;
          case '合单':return sum%2===1;
          case '合双':return sum%2===0;
          case '合大':return sum>=7;
          case '合小':return sum<=6;
          case '尾大':return tail>=5;
          case '尾小':return tail<=4;
          case '大单':return v>=25&&v%2===1;
          case '小单':return v<=24&&v%2===1;
          case '大双':return v>=25&&v%2===0;
          case '小双':return v<=24&&v%2===0;
        } return false;
      });
    }else if(group==='animal'){
      const zs=item.startsWith('家禽')?poultry:wild;
      out=zs.flatMap(z=>zodiacNumbers[z]||[]);
    }else if(group==='element'){
      out=elements[item]||[];
    }else if(group==='harmony'||group==='clash'){
      out=(group==='harmony'?harmonyMap:clashMap)[item].flatMap(z=>zodiacNumbers[z]||[]);
    }else if(group==='color'){
      out=colorMap[item.replace('波','')]||[];
    }else if(group==='colorOddEven'){
      const color=item.slice(0,1), oddEven=item.slice(1);
      out=(colorMap[color]||[]).filter(n=>oddEven==='单'?Number(n)%2===1:Number(n)%2===0);
    }else if(group==='head'){
      const h=Number(item[0]); out=nums.filter(n=>Number(n[0])===h);
    }else if(group==='tail'){
      const t=Number(item[0]); out=nums.filter(n=>Number(n[1])===t);
    }
    return new Set(out);
  }
  function renderGroups(){
    const host=$('paGroups');
    host.innerHTML='';
    groups.forEach(g=>{
      const box=document.createElement('div'); box.className='pa-group';
      const title=document.createElement('div'); title.className='pa-group-title'; title.textContent=g.title;
      const row=document.createElement('div'); row.className='pa-buttons';
      g.items.forEach(item=>{
        const b=document.createElement('button'); b.type='button'; b.textContent=item;
        b.dataset.group=g.key;b.dataset.item=item;
        b.addEventListener('click',()=>{
          const key=g.key+'::'+item;
          if(selected.has(key))selected.delete(key);else selected.set(key,{group:g.key,item});
          b.classList.toggle('pa-active',selected.has(key));
          pick();
        });
        row.appendChild(b);
      });
      box.append(title,row);host.appendChild(box);
    });
  }
  function pick(){
    const byGroup=new Map();
    selected.forEach(v=>{
      if(!byGroup.has(v.group))byGroup.set(v.group,[]);
      byGroup.get(v.group).push(getAttrSet(v.group,v.item));
    });
    if(!byGroup.size){
      result=[];resultReady=false;renderResult();
      $('paStatus').textContent='请至少选择一个条件。';return;
    }
    let answer=null;
    byGroup.forEach(sets=>{
      const union=new Set();sets.forEach(set=>set.forEach(n=>union.add(n)));
      if(answer===null)answer=union;
      else answer=new Set([...answer].filter(n=>union.has(n)));
    });
    result=nums.filter(n=>answer&&answer.has(n));
    resultReady=true;renderResult();
    $('paStatus').textContent=result.length?'号码已放入左侧输入框，并自动添加“各号”；在左侧填写金额后点击“计入”，按每个号码金额统计。需要总额分摊时，请只使用本助手的“平摊计入”。':'没有号码同时符合这些条件，请调整选择。';
  }
  function getNumbersFromInput(){
    const input=$('betInput');
    if(!input)return [];
    // 只解析“各”之前的号码，不能把金额（例如 50）误当成号码。
    const numberPart=input.value.split(/各号?|每个号码|各号码/)[0];
    const found=numberPart.match(/\d{1,2}/g)||[];
    const valid=[];
    found.forEach(x=>{const n=String(Number(x)).padStart(2,'0');if(nums.includes(n)&&!valid.includes(n))valid.push(n);});
    return valid.sort((a,b)=>Number(a)-Number(b));
  }
  function renderResult(){
    const input=$('betInput');
    if(input){
      // 条件变化时保留用户已经输入在“各”后面的金额。
      const amountMatch=input.value.match(/各号?\s*(\d+(?:\.\d*)?)\s*$/);
      const amountSuffix=amountMatch?amountMatch[1]:'';
      input.value=result.length?result.join(' ')+'各号'+amountSuffix:'';
      input.dispatchEvent(new Event('input',{bubbles:true}));
    }
    $('paResultCount').textContent='('+result.length+'个号码)';
  }
  function syncEditedResult(){
    // 电脑版以左侧主输入框为唯一可编辑的选号结果来源。
    result=getNumbersFromInput();
    resultReady=true;
    $('paResultCount').textContent='('+result.length+'个号码)';
  }
  function clearAll(){
    selected.clear();result=[];resultReady=false;
    $('paGroups').querySelectorAll('button.pa-active').forEach(b=>b.classList.remove('pa-active'));
    renderResult();$('paStatus').textContent='已清空选择和左侧输入框中的选号结果。';
  }
  async function copyResult(){
    syncEditedResult();
    if(!resultReady||!result.length){$('paStatus').textContent='请先选择条件并在左侧输入框确认号码。';return;}
    const text=result.join(' ');
    try{await navigator.clipboard.writeText(text);$('paStatus').textContent='挑码结果已复制。';}
    catch(e){
      const ta=document.createElement('textarea');ta.value=text;overlay.appendChild(ta);ta.select();
      let ok=false;try{ok=document.execCommand('copy');}catch(_){}
      ta.remove();$('paStatus').textContent=ok?'挑码结果已复制。':'复制失败，请手动复制结果。';
    }
  }
  function directBet(){
    syncEditedResult();
    if(!resultReady||!result.length){$('paStatus').textContent='请先选择条件，并确认左侧输入框里有有效号码。';return;}
    const eachAmount=Number($('paAmountEach').value);
    const totalAmount=Number($('paAmountTotal').value);
    const eachValid=Number.isFinite(eachAmount)&&eachAmount>0;
    const totalValid=Number.isFinite(totalAmount)&&totalAmount>0;
    if(eachValid&&totalValid){$('paStatus').textContent='请只填写一个金额框：按每个号码下注填“各号”，按总金额分摊填“各”。';return;}
    if(!eachValid&&!totalValid){$('paStatus').textContent='请在“各号”或“各”金额框中填写大于 0 的金额。';$('paAmountEach').focus();return;}
    const board=/香港|港|香/.test(($('betInput')?.value)||'')?'hk':'normal';
    let entries;
    if(eachValid){
      entries=result.map(n=>n+':'+String(eachAmount));
    }else{
      const perNumber=Math.floor((totalAmount/result.length)*100000)/100000;
      entries=result.map(n=>n+':'+String(perNumber));
      $('paStatus').textContent='总金额 '+totalAmount+' ÷ '+result.length+' 个号码 = 每个号码 '+String(perNumber)+'（保留5位小数，实际分摊合计可能有少量舍入差）。';
    }
    // 专用标记让原下注统计准确入账，不让通用解析器把小数点误判为号码分隔符。
    const text='__PA_BET__'+(board==='hk'?'hk':'normal')+'|'+entries.join(',');
    const input=document.getElementById('betInput');
    if(!input){$('paStatus').textContent='找不到原计算页面的下注输入框。';return;}
    // Only the explicit "direct bet" action touches the existing calculator.
    input.value=text;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    closeModal();
    // Click the existing 下注 button so the original history, undo tracking,
    // preview and Supabase sync event hooks all run exactly as usual.
    const existingBetButton=document.querySelector('.button-group button[onclick="placeBet()"]');
    if(existingBetButton) existingBetButton.click();
    else $('betInput').focus();
  }
  function resetPickerAfterSubmit(){
    selected.clear();result=[];resultReady=false;
    $('paGroups').querySelectorAll('button.pa-active').forEach(b=>b.classList.remove('pa-active'));
    $('paResultCount').textContent='(0个号码)';
    $('paAmountTotal').value='0';
    $('paAmountEach').value='可在输入框内填写';
    $('paStatus').textContent='已平摊计入，挑码助手已恢复默认状态。';
  }
  function preparePickerSubmission(){
    const input=$('betInput');
    if(!input)return;
    // 关键防冲突：挑码助手“平摊计入”已生成专用载荷，必须直接交给 placeBet()；
    // 不允许捕获阶段再次读取载荷中的号码/金额并重新分摊，否则会把金额数字误识别成号码。
    if(/^__PA_BET__(?:normal|hk)\|/.test(input.value.trim())) return;
    const hasPickerSelection=selected.size>0;
    const total=Number($('paAmountTotal').value);
    if(hasPickerSelection && Number.isFinite(total) && total>0){
      const picked=getNumbersFromInput();
      if(picked.length){
        // 各金额表示这组选中号码的总金额；平均分摊，不把差额补给最后一个号码。
        const perNumber=Math.floor((total/picked.length)*100000)/100000;
        const entries=picked.map(n=>n+':'+String(perNumber));
        const visibleValue=input.value;
        const board=/香港|港|香/.test(visibleValue)?'hk':'normal';
        input.value='__PA_BET__'+board+'|'+entries.join(',');
        // 这是内部入账载荷，不派发 input 事件，避免普通文本预处理改写载荷。
        setTimeout(resetPickerAfterSubmit,0);
        return;
      }
      // 若用户把结果改成生肖/波色/大小等文字写法，则将金额补到末尾“各”后交给原解析器。
      if(/各\s*$/.test(input.value)){
        input.value=input.value.replace(/各\s*$/,'各'+String(total));
        input.dispatchEvent(new Event('input',{bubbles:true}));
      }
    }
    if(hasPickerSelection)setTimeout(resetPickerAfterSubmit,0);
  }
  function openModal(){overlay.classList.add('pa-open');document.body.style.overflow='hidden';$('paClose').focus();}
  function closeModal(){overlay.classList.remove('pa-open');document.body.style.overflow='';document.getElementById('openPickerAssistant')?.focus();}
  // 左侧“计入”只走原解析逻辑，挑码助手的总额分摊只由“平摊计入”按钮触发。
  // 不在左侧按钮捕获阶段自动分摊，避免两套金额规则互相覆盖。
  renderGroups();
  $('betInput').addEventListener('input',()=>{if(resultReady){result=getNumbersFromInput();$('paResultCount').textContent='('+result.length+'个号码)';}});
  document.getElementById('openPickerAssistant').addEventListener('click',openModal);
  $('paClose').addEventListener('click',closeModal);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  $('paClear').addEventListener('click',clearAll);
  $('paCopy').addEventListener('click',copyResult);
  $('paCountTotal').addEventListener('click',directBet);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('pa-open'))closeModal();});
})();
</script>

<!-- ===== 电脑版后台统计同步：沿用手机版时间窗口与记录规则 ===== -->
<script id="supabaseSyncLayer">
(function(){
  const SB_URL = "https://ftpbklczxrbalhzuozsh.supabase.co";
  const SB_KEY = "sb_publishable_ZjKRYyiuoQeF8HDLRs5Guw_VOY1wnwy";
  const TABLE = "bet_records";
  const REST = SB_URL.replace(/\/+$/,'') + "/rest/v1/" + TABLE;
  const DEVICE_KEY = "jxDeviceNameV1";

  function getDeviceName(){
    let v = localStorage.getItem(DEVICE_KEY);
    if(!v){
      const code = Math.random().toString(36).slice(2,6).toUpperCase();
      v = "电脑-" + code;
      localStorage.setItem(DEVICE_KEY, v);
    }
    return v;
  }
  function cloneBoard(board){
    return Object.fromEntries(numbers.map(n => [n, Number(board[n] || 0)]));
  }
  function diffBoard(before, after){
    return numbers.map(n => ({num:n, delta:Number(after[n]||0)-Number(before[n]||0)}))
      .filter(x => Math.abs(x.delta) > 1e-9);
  }
  function totalAbs(changes){
    return changes.reduce((s,x)=>s+Math.abs(x.delta),0);
  }
  function vnParts(date=new Date()){
    const parts = new Intl.DateTimeFormat('en-GB',{
      timeZone:'Asia/Ho_Chi_Minh', year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    }).formatToParts(date);
    const o={}; parts.forEach(p=>{ if(p.type!=='literal') o[p.type]=p.value; });
    return o;
  }
  function inVnWindow(){
    const p=vnParts();
    const mins=Number(p.hour)*60+Number(p.minute);
    return mins >= 18*60 && mins <= 21*60+20;
  }
  function setSyncStatus(msg, ok=true){
    let el=document.getElementById('supabaseSyncStatus');
    if(!el){
      el=document.createElement('div');
      el.id='supabaseSyncStatus';
      el.style.cssText='max-width:760px;margin:8px auto;text-align:center;font-size:13px;color:#666;';
      const row=document.querySelector('.button-group');
      if(row) row.insertAdjacentElement('afterend',el);
    }
    el.textContent=msg;
    el.style.color=ok?'#1a7f37':'#c62828';
  }
  async function api(method, suffix='', body=null, prefer='return=minimal'){
    const headers={'apikey':SB_KEY,'Content-Type':'application/json','Prefer':prefer};
    const res=await fetch(REST+suffix,{method,headers,body:body?JSON.stringify(body):undefined});
    const raw=await res.text();
    if(!res.ok) throw new Error(raw || ('HTTP '+res.status));
    if(!raw) return null;
    try{return JSON.parse(raw);}catch(_){return raw;}
  }

  let lastRemote = null; // {id, undone, promise}
  const originalPlaceBet = window.placeBet;
  const originalUndoLastBet = window.undoLastBet;
  const originalResetBets = window.resetBets;

  window.placeBet = function(){
    const input=document.getElementById('betInput');
    const raw=(input?.value||'').trim();
    const isHk=/香港|港|香/.test(raw);
    const board=isHk?hkBets:bets;
    const before=cloneBoard(board);

    originalPlaceBet.apply(this,arguments);

    const after=cloneBoard(isHk?hkBets:bets);
    const changes=diffBoard(before,after);
    if(!changes.length) return;

    if(!inVnWindow()){
      setSyncStatus('本次下注成功；当前不在越南时间 18:00–21:20，不上传后台。', true);
      lastRemote=null;
      return;
    }

    const record={
      device_name:getDeviceName(),
      bet_type:isHk?'香港盘':'普通盘',
      bet_content:raw,
      amount:totalAbs(changes),
      bet_count:changes.length,
      bet_details:changes.map(x=>({num:x.num,amount:Number(x.delta)})),
      is_undone:false
    };
    const state={id:null,undone:false,promise:null};
    lastRemote=state;
    setSyncStatus('下注成功，正在同步后台…', true);

    state.promise=api('POST','',record,'return=representation')
      .then(rows=>{
        const row=Array.isArray(rows)?rows[0]:rows;
        state.id=row && row.id!=null ? row.id : null;
        if(state.undone && state.id!=null){
          return api('PATCH','?id=eq.'+encodeURIComponent(state.id),{is_undone:true})
            .then(()=>setSyncStatus('已同步，并已标记为撤回。',true));
        }
        setSyncStatus('已同步后台｜'+record.device_name,true);
      })
      .catch(err=>{
        console.error('Supabase insert failed:',err);
        setSyncStatus('后台同步失败：'+String(err.message||err).slice(0,120),false);
      });
  };

  window.undoLastBet = function(){
    const state=lastRemote;
    originalUndoLastBet.apply(this,arguments);
    if(!state) return;
    state.undone=true;
    if(state.id!=null){
      api('PATCH','?id=eq.'+encodeURIComponent(state.id),{is_undone:true})
        .then(()=>setSyncStatus('上一笔已撤回，后台也已作废。',true))
        .catch(err=>{
          console.error('Supabase undo failed:',err);
          setSyncStatus('本机已撤回，但后台撤回同步失败：'+String(err.message||err).slice(0,100),false);
        });
    }else if(state.promise){
      setSyncStatus('本机已撤回，等待后台同步后自动作废…',true);
    }
    lastRemote=null;
  };

  window.resetBets = function(){
    originalResetBets.apply(this,arguments);
    lastRemote=null;
    setSyncStatus('本机已归零；后台历史记录不受影响。',true);
  };

  setSyncStatus('电脑版后台同步已连接｜'+getDeviceName()+'｜仅越南时间 18:00–21:20 上传',true);
})();
</script>

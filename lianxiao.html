'use strict';
const $=s=>document.querySelector(s), LS='lottery_book_clean_lianxiao_sansansan_v1', WATER_RATE_KEY=LS+'_water_rate';

const state={rows:Array.from({length:90},blankRow),draw:null,hkDraw:null};
function blankRow(){return{amount:'',hit:'',raw:'',entries:[]}}

function fmt(x){return Number.isInteger(x)?String(x):String(Number(Number(x).toFixed(4)))}
function simpZodiac(z){return String(z||'').replace(/龍/g,'龙').replace(/雞/g,'鸡').replace(/豬/g,'猪').replace(/馬/g,'马')}
function zodiacOf(num){num=String(num).padStart(2,'0');for(const z in zodiacNumbers)if(zodiacNumbers[z].includes(num))return z;return ''}
function ballColor(num){num=String(num).padStart(2,'0');for(const c of ['红','蓝','绿'])if(colorMap[c].includes(num))return c==='红'?'red':c==='蓝'?'blue':'green';return 'green'}
function status(t){$('#status').textContent=t;clearTimeout(status.t);status.t=setTimeout(()=>$('#status').textContent='数据自动保存在本机',2200)}

function half(s){return String(s||'').replace(/[\u200B-\u200F\uFEFF]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[－–—−]/g,'-').replace(/[，、]/g,',').replace(/[：]/g,':').replace(/　/g,' ')}
function numeral(s){return ({'一':1,'二':2,'两':2,'三':3,'四':4,'五':5})[s]||Number(s)||0}
function cnNum(v){const d={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};if(!v)return 0;const shorthand=v.match(/^([一二两三四五六七八九])百([一二两三四五六七八九])$/);if(shorthand)return d[shorthand[1]]*100+d[shorthand[2]]*10;let total=0,section=0,current=0;for(const ch of v){if(Object.prototype.hasOwnProperty.call(d,ch)){current=d[ch];continue}const unit=ch==='十'?10:ch==='百'?100:ch==='千'?1000:0;if(!unit)return 0;section+=(current||1)*unit;current=0}return total+section+current}function stakeIn(s,allowTail){const amount='(?:\\d+(?:\\.\\d+)?|[一二两三四五六七八九十百千零]+)',m=s.match(new RegExp('(?:每组各|每组下|每组|各组|每注|各注|每个|各|个|下|买)\\s*('+amount+')\\s*(?:元|米|块|斤)?'));if(m)return /^\d/.test(m[1])?Number(m[1]):cnNum(m[1]);if(allowTail){const t=s.match(new RegExp('('+amount+')\\s*(?:元|米|块|斤)?\\s*$'));if(t)return /^\d/.test(t[1])?Number(t[1]):cnNum(t[1])}return 0}
function stripStake(s,allowTail){const amount='(?:\\d+(?:\\.\\d+)?|[一二两三四五六七八九十百千零]+)';let out=s.replace(new RegExp('(?:每组各|每组下|每组|各组|每注|各注|每个|各|个|下|买)\\s*'+amount+'\\s*(?:元|米|块|斤)?','g'),' ');if(allowTail)out=out.replace(new RegExp(amount+'\\s*(?:元|米|块|斤)?\\s*$'),' ');return out}
function combos(a,k){const out=[];function go(i,p){if(p.length===k){out.push(p.slice());return}for(let j=i;j<=a.length-(k-p.length);j++)go(j+1,p.concat(a[j]))}go(0,[]);return out}

function calc(){const es=state.rows.flatMap(r=>r.entries||[]),t=total(state.rows.map(r=>Number(r.amount)||0)),prize=total(es.map(e=>settle(e).payout)),w={n2:0,n3:0,n32:0,z2:0,z3:0,z4:0,z5:0};for(const e of es){const draw=drawFor(e);if(!draw)continue;const normal=new Set((draw.normal||[]).map(x=>String(x.number).padStart(2,'0'))),draws=(draw.normal||[]).slice();if(draw.special)draws.push(draw.special);const zset=new Set(draws.map(x=>simpZodiac(x.zodiac||zodiacOf(x.number))));if(e.type==='number2'&&e.values.every(x=>normal.has(x)))w.n2+=Number(e.stake)||0;else if(e.type==='number3'&&e.values.every(x=>normal.has(x)))w.n3+=Number(e.stake)||0;else if(e.type==='number3_2'&&e.values.filter(x=>normal.has(x)).length>=2)w.n32+=Number(e.stake)||0;else if(e.type==='zodiac'&&e.values.length>=2&&e.values.length<=5&&e.values.every(x=>zset.has(x)))w['z'+e.values.length]+=Number(e.stake)||0}$('#grandTotal').textContent=fmt(t);const water=total([t*waterRate]),remainder=total([t-water-prize]);$('#cTotal').textContent=fmt(t);$('#cWater').textContent=fmt(water);$('#waterRateLabel').textContent=Math.round(waterRate*100)+'%';$('#cPrize').textContent=fmt(prize);$('#cProfit').textContent=fmt(remainder);$('#wN2').textContent=fmt(w.n2);$('#wN3').textContent=fmt(w.n3);$('#wN32').textContent=fmt(w.n32);$('#wZ2').textContent=fmt(w.z2);$('#wZ3').textContent=fmt(w.z3);$('#wZ4').textContent=fmt(w.z4);$('#wZ5').textContent=fmt(w.z5)}
function makeDraw(nums,date,period){const a=nums.map(v=>String(parseInt(v,10)).padStart(2,'0'));return{date:date||'',period:period||'',normal:a.slice(0,6).map(number=>({number:number,zodiac:zodiacOf(number)})),special:{number:a[6],zodiac:zodiacOf(a[6])}}}
function drawBar(id,d,label){const el=$(id);if(!d){el.innerHTML='<div class="draw-title">'+label+'<br>未读取</div>';return}let h='<div class="draw-title">'+esc(d.date||label)+'<br>'+esc(d.period||'')+'</div><div class="draw-balls">';d.normal.forEach(x=>{const n=String(x.number).padStart(2,'0');h+='<div class="ball-wrap"><div class="ball '+ballColor(n)+'">'+n+'</div><div class="ball-zodiac">'+esc(x.zodiac||zodiacOf(n))+'</div></div>'});if(d.special){const n=String(d.special.number).padStart(2,'0');h+='<div class="plus">+</div><div class="ball-wrap"><div class="ball '+ballColor(n)+'">'+n+'</div><div class="ball-zodiac">'+esc(d.special.zodiac||zodiacOf(n))+'</div></div>'}el.innerHTML=h+'</div>'}
function renderDraw(){drawBar('#drawBar',state.draw,'澳门开奖');drawBar('#hkDrawBar',state.hkDraw,'香港开奖')}
const DIRECT_DRAW_API='https://macaumarksix.com/api/macaujc2.com';
function parseOfficialLatest(j){let r=Array.isArray(j)?j[0]:j;if(r&&Array.isArray(r.data))r=r.data[0];if(!r||typeof r!=='object')throw Error('接口返回为空');const raw=Array.isArray(r.openCode)?r.openCode:String(r.openCode||r.code||r.result||'').split(/[,\s|]+/).filter(Boolean),nums=raw.map(x=>String(parseInt(x,10)).padStart(2,'0'));if(nums.length!==7||new Set(nums).size!==7||nums.some(x=>!/^(0[1-9]|[1-4][0-9])$/.test(x)))throw Error('开奖号码无效');let z=Array.isArray(r.zodiac)?r.zodiac:String(r.zodiac||'').split(/[,\s|]+/).filter(Boolean);z=z.map(simpZodiac);const d=makeDraw(nums,r.openTime||r.date||'',r.expect?'第'+r.expect+'期':'新开');d.normal.forEach((x,i)=>x.zodiac=z[i]||x.zodiac);d.special.zodiac=z[6]||d.special.zodiac;return d}
async function fetchOfficialLatest(){const urls=[DIRECT_DRAW_API,'https://api.allorigins.win/raw?url='+encodeURIComponent(DIRECT_DRAW_API),'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(DIRECT_DRAW_API)];let err='';for(const url of urls){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const raw=await r.text();let j;try{j=JSON.parse(raw)}catch(e){throw Error('接口返回的不是JSON')}return parseOfficialLatest(j)}catch(e){err=e.message||String(e)}}throw Error(err||'接口读取失败')}
const HKJC_MARKSIX_API='https://info.cld.hkjc.com/graphql/base/';
const HKJC_MARKSIX_QUERY='fragment lotteryDrawsFragment on LotteryDraw { id year no openDate closeDate drawDate status snowballCode snowballName_en snowballName_ch lotteryPool { sell status totalInvestment jackpot unitBet estimatedPrize derivedFirstPrizeDiv lotteryPrizes { type winningUnit dividend } } drawResult { drawnNo xDrawnNo } } query marksixResult($lastNDraw: Int, $startDate: String, $endDate: String, $drawType: LotteryDrawType) { lotteryDraws(lastNDraw: $lastNDraw startDate: $startDate endDate: $endDate drawType: $drawType) { ...lotteryDrawsFragment } }';
function parseHkjc(j){const list=j&&j.data&&j.data.lotteryDraws;if(!Array.isArray(list)||!list.length)throw Error('香港赛马会未返回开奖');const r=list.find(x=>x&&x.drawResult&&x.drawResult.drawnNo&&x.drawResult.drawnNo.length>=6&&x.drawResult.xDrawnNo!=null);if(!r)throw Error('香港最新一期暂未开奖');const d=makeDraw(r.drawResult.drawnNo.slice(0,6).concat([r.drawResult.xDrawnNo]),r.drawDate||r.openDate||'',String(r.year||'')+'/'+String(r.no||'').padStart(3,'0'));return d}
async function fetchHk(){const r=await fetch(HKJC_MARKSIX_API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({operationName:'marksixResult',variables:{lastNDraw:3},query:HKJC_MARKSIX_QUERY})});if(!r.ok)throw Error('香港赛马会 HTTP '+r.status);return parseHkjc(await r.json())}
async function refreshDraw(){status('正在读取开奖数据…');const res=await Promise.allSettled([fetchOfficialLatest(),fetchHk()]);if(res[0].status==='fulfilled')state.draw=res[0].value;if(res[1].status==='fulfilled')state.hkDraw=res[1].value;state.rows.forEach(r=>{if(r.raw)r.hit=winnings(r.entries)});save();renderDraw();renderTable();calc();status(res.some(x=>x.status==='fulfilled')?'开奖数据已更新':'开奖读取失败，请稍后重试')}
function loadWaterRate(){try{const n=Number(localStorage.getItem(WATER_RATE_KEY));if(Number.isFinite(n)&&n>=0.04&&n<=0.15&&Math.round(n*100)===n*100)waterRate=n}catch(e){}}function openWaterSettings(){const sel=$('#waterRateSelect');sel.innerHTML=Array.from({length:12},(_,i)=>{const rate=(i+4)/100;return '<option value="'+rate.toFixed(2)+'">'+Math.round(rate*100)+'%（'+rate.toFixed(2)+'）</option>'}).join('');sel.value=waterRate.toFixed(2);$('#waterModal').classList.add('open')}function saveWaterSettings(){const n=Number($('#waterRateSelect').value);if(!Number.isFinite(n)||n<0.04||n>0.15)return;waterRate=n;try{localStorage.setItem(WATER_RATE_KEY,waterRate.toFixed(2))}catch(e){}$('#waterModal').classList.remove('open');calc();status('水钱率已保存：'+Math.round(waterRate*100)+'%')}
function clearAll(){if(!confirm('确定全部清零？'))return;state.rows=Array.from({length:90},blankRow);$('#pasteBox').value='';save('已全部清零');renderTable();calc();preview()}
function openDelete(){const ids=state.rows.map((r,i)=>r.raw?i:-1).filter(i=>i>=0);if(!ids.length)return status('当前没有可删除序号');$('#deleteSelect').innerHTML=ids.map(i=>'<option value="'+i+'">序号 '+(i+1)+'（金额 '+esc(state.rows[i].amount)+'）</option>').join('');$('#deleteModal').classList.add('open')}
function deleteSelected(){const i=Number($('#deleteSelect').value);state.rows.splice(i,1);state.rows.push(blankRow());$('#deleteModal').classList.remove('open');save('序号已删除');renderTable();calc()}
function fitSheet(){const sheet=$('#sheet'),wrap=$('#sheetWrap');if(!sheet||!wrap)return;sheet.style.transform='none';sheet.style.width='100%';wrap.style.height='auto';if(innerWidth>760)return;const top=wrap.getBoundingClientRect().top,available=Math.max(240,innerHeight-top-3),h=sheet.scrollHeight,w=sheet.scrollWidth,scale=Math.min(1,available/h,(innerWidth-6)/w);sheet.style.transform='scale('+scale+')';sheet.style.width=(100/scale)+'%';wrap.style.height=(h*scale)+'px'}
function collapsePasteBox(){$('#pastePanel').classList.remove('expanded')}function expandPasteBox(){$('#pastePanel').classList.add('expanded')}$('#pasteBox').addEventListener('focus',expandPasteBox);$('#pasteBox').addEventListener('blur',collapsePasteBox);document.addEventListener('pointerdown',e=>{if(e.target!==$('#pasteBox'))collapsePasteBox()});$('#importBtn').onclick=importRows;$('#pasteBox').addEventListener('input',preview);$('#pasteBox').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')importRows()});$('#refreshDraw').onclick=refreshDraw;$('#printBtn').onclick=()=>window.print();$('#clearAllBtn').onclick=clearAll;$('#deleteSeqBtn').onclick=openDelete;$('#cancelDelete').onclick=()=>$('#deleteModal').classList.remove('open');$('#confirmDelete').onclick=deleteSelected;$('#deleteModal').onclick=e=>{if(e.target.id==='deleteModal')$('#deleteModal').classList.remove('open')};$('#waterRateBtn').onclick=openWaterSettings;$('#cancelWater').onclick=()=>$('#waterModal').classList.remove('open');$('#saveWater').onclick=saveWaterSettings;$('#waterModal').onclick=e=>{if(e.target.id==='waterModal')$('#waterModal').classList.remove('open')};window.addEventListener('resize',()=>setTimeout(fitSheet,60));
load();loadWaterRate();renderDraw();renderTable();calc();preview();status('正在读取开奖数据…');setTimeout(refreshDraw,300);
</script>
<script>
(function(){
  const MODE_KEY='lottery_last_mode_v1';
  const SKIP_AUTO_KEY='lottery_skip_auto_redirect_once_v1';
  const A_FILE='index.html';
  try{localStorage.setItem(MODE_KEY,'lianxiao')}catch(e){}
  const btn=document.getElementById('switchToNormalBtn');

    try{localStorage.setItem(MODE_KEY,'normal');sessionStorage.setItem(SKIP_AUTO_KEY,'1')}catch(e){}
